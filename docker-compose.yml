services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: projecthub-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
    networks:
      - projecthub-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: "https://project-hub-app.duckdns.org"
        NEXT_PUBLIC_API_URL: "https://project-hub-app.duckdns.org/api"
        NEXT_PUBLIC_RAZORPAY_KEY: "rzp_test_T53vEom3rGjiLE"
    container_name: projecthub-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - projecthub-network

networks:
  projecthub-network:
    driver: bridge
